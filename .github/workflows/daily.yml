name: Daily quote extraction
on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC — 5am ET, 11am Madrid (summer)
    - cron: '0 14 * * *'  # 14:00 UTC — 10am ET, 4pm Madrid (summer)
    - cron: '0 20 * * *'  # 20:00 UTC — 4pm ET, 10pm Madrid (summer)
  workflow_dispatch:
    inputs:
      extra_videos:
        description: "Optional: YouTube URLs to also process (one per line or comma-separated)"
        required: false
        type: string
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5h, well under the 6h GitHub Actions ceiling
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run extractor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OUTPUT_BASE_URL: ${{ secrets.OUTPUT_BASE_URL }}
          EXTRA_VIDEOS: ${{ inputs.extra_videos }}
        run: python quote_extractor.py
      - name: Mirror output/ into docs/ for GitHub Pages
        if: always()
        run: |
          mkdir -p docs/output
          if [ -d output ]; then
            rsync -a --delete output/ docs/output/
          fi
          cat > docs/index.md <<'EOF'
          # HoopsHype YouTube quotes
          See the [browsable archive](output/) of all processed videos.
          EOF
      - name: Commit and push any new files
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add output docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}" || {
            echo "Pull-rebase failed; aborting push to avoid clobbering."
            exit 1
          }
          git push origin "HEAD:${GITHUB_REF_NAME}"