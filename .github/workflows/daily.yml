name: Daily quote extraction
on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC — 5am ET, 11am Madrid (summer)
    - cron: '0 14 * * *'  # 14:00 UTC — 10am ET, 4pm Madrid (summer)
    - cron: '0 20 * * *'  # 20:00 UTC — 4pm ET, 10pm Madrid (summer)
  workflow_dispatch:
    inputs:
      extra_videos:
        description: "Optional: YouTube URLs to also process (one per line or comma-separated)"
        required: false
        type: string

# Serialize all runs (scheduled cron + workflow_dispatch) so concurrent runs
# can't race each other to the same per-video output files. cancel-in-progress
# is false: a newer trigger queues behind the current run instead of killing
# it. With 3 crons/day spaced 5-6 hours apart and per-video timeouts capping
# each run, queueing is safe.
concurrency:
  group: daily-extract
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    # 45 min outer cap = 30 min inner SIGALRM script budget + setup
    # (checkout / pip install) + mirror + commit/push retry + slack post.
    # If the script's SIGALRM handler runs as expected, the job finishes
    # well under this. If a hung Gemini socket doesn't yield to the
    # signal handler, GitHub kills the job at 45 min instead of the
    # default 4h, freeing the daily-extract concurrency lock for the
    # next scheduled cron.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run extractor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OUTPUT_BASE_URL: ${{ secrets.OUTPUT_BASE_URL }}
          EXTRA_VIDEOS: ${{ inputs.extra_videos }}
          # Empty for workflow_dispatch and unknown event types; the cron
          # expression (e.g. "0 9 * * *") for schedule events. Used to
          # derive the run slot for per-run digest filenames.
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python quote_extractor.py
      - name: Mirror output/ into docs/ for GitHub Pages
        if: always()
        run: |
          mkdir -p docs/output
          if [ -d output ]; then
            rsync -a --delete output/ docs/output/
          fi
          cat > docs/index.md <<'EOF'
          # HoopsHype YouTube quotes
          See the [browsable archive](output/) of all processed videos.
          EOF
      - name: Commit and push any new files
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add output docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily run: $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Push with up to 3 retries on non-fast-forward. The concurrency
          # lock above makes this rare, but a manual commit landing during
          # the brief window between this job's checkout and push can
          # still trip it. On each failure we fetch + rebase onto the
          # latest remote tip and try again. If rebase produces conflicts
          # or we exhaust the retry budget, we log loudly and exit 0 — the
          # per-video files are valuable on the runner's disk and we don't
          # want one transient push race to fail the whole workflow.
          max_retries=3
          attempt=0
          while true; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              if [ "$attempt" -gt 0 ]; then
                echo "Push succeeded on retry ${attempt}/${max_retries}."
              fi
              exit 0
            fi
            if [ "$attempt" -ge "$max_retries" ]; then
              echo "==> Push failed after $((max_retries + 1)) attempts. Run artifacts remain on the runner but were not pushed to origin. Exiting cleanly so the workflow doesn't fail."
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Push failed; retry ${attempt}/${max_retries}: fetching + rebasing onto origin/${GITHUB_REF_NAME}"
            if ! git fetch origin "${GITHUB_REF_NAME}"; then
              echo "Fetch failed; exiting cleanly without pushing."
              exit 0
            fi
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              echo "Rebase had conflicts; aborting rebase and exiting cleanly without pushing."
              git rebase --abort || true
              exit 0
            fi
          done
      # Slack runs LAST, after git push, so the linked digest URLs are
      # guaranteed to be live on origin by the time anyone clicks through.
      # `if: always()` runs the step even when the extractor exited
      # non-zero (e.g. SIGALRM force-exit 3 from a hung background
      # thread). hashFiles() skips when the extractor crashed before
      # writing the payload.
      - name: Post Slack notification
        if: always() && hashFiles('.slack_payload.json') != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OUTPUT_BASE_URL: ${{ secrets.OUTPUT_BASE_URL }}
        run: python slack_notify_from_file.py .slack_payload.json